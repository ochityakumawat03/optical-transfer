<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Optical Transfer</title>
  
  <!-- Legacy-compatible CDN dependencies (Pure JS) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { font-size: 1.2rem; margin-bottom: 15px; color: #00e676; }
    
    .nav { display: flex; width: 100%; max-width: 400px; margin-bottom: 15px; gap: 10px; }
    .nav button { flex: 1; padding: 12px; background: #222; color: #888; border: 1px solid #333; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .nav button.active { background: #00e676; color: #000; border-color: #00e676; }
    
    .card { width: 100%; max-width: 400px; background: #1e1e1e; padding: 15px; border-radius: 12px; border: 1px solid #333; display: none; text-align: center; }
    .card.active { display: block; }
    
    input[type="file"] { margin: 15px 0; width: 100%; color: #ccc; }
    
    #qr-container { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; margin: 15px 0; min-width: 250px; min-height: 250px; }
    #qr-container img, #qr-container canvas { display: block; margin: 0 auto; }
    
    #video { width: 100%; max-width: 360px; height: auto; border-radius: 8px; background: #000; margin-bottom: 10px; }
    
    .progress-bar { width: 100%; background: #333; height: 16px; border-radius: 8px; overflow: hidden; margin: 15px 0; }
    .progress-fill { width: 0%; height: 100%; background: #00e676; transition: width 0.1s linear; }
    
    .stats { font-size: 0.85rem; color: #aaa; margin-top: 5px; }
    .btn-action { width: 100%; padding: 12px; background: #00e676; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .btn-action:disabled { background: #444; color: #888; }
  </style>
</head>
<body>

  <h1>Optical File Transfer</h1>

  <div class="nav">
    <button id="tab-send-btn" class="active" onclick="switchTab('send')">Send</button>
    <button id="tab-recv-btn" onclick="switchTab('recv')">Receive</button>
  </div>

  <!-- SENDER UI -->
  <div id="tab-send" class="card active">
    <input type="file" id="file-input" onchange="loadFile()">
    <div id="qr-container">
      <p style="color: #666; padding-top: 100px;">Select a file to stream</p>
    </div>
    <div class="stats" id="send-stats">Speed: 10 FPS | Block size: 128B</div>
  </div>

  <!-- RECEIVER UI -->
  <div id="tab-recv" class="card">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>
    
    <div class="stats" id="recv-stats">Status: Tap "Start Camera"</div>
    <button id="cam-btn" class="btn-action" onclick="toggleCamera()">Start Camera</button>
  </div>

  <script>
    // --- APP STATE & FOUNTAIN CODE UTILS ---
    var BLOCK_SIZE = 128;
    var sendTimer = null;
    var videoStream = null;
    var scanning = false;
    
    // File State
    var sendBlocks = [];
    var sendFileName = "";
    var totalBlocks = 0;
    var sendSeed = 1;
    
    // Receiver Decoder State
    var recvTotal = 0;
    var recvFileName = "";
    var solvedBlocks = {};
    var solvedCount = 0;
    var receivedEquations = []; // [{indices: [], data: Uint8Array}]

    function switchTab(tab) {
      document.getElementById('tab-send-btn').className = tab === 'send' ? 'active' : '';
      document.getElementById('tab-recv-btn').className = tab === 'recv' ? 'active' : '';
      document.getElementById('tab-send').className = tab === 'send' ? 'card active' : 'card';
      document.getElementById('tab-recv').className = tab === 'recv' ? 'card active' : 'card';
      if (tab !== 'recv' && scanning) toggleCamera();
    }

    // Pseudo-Random Generator (ES5 compatible seedable PRNG)
    function PRNG(seed) {
      var s = seed;
      return function() {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }

    // Soliton distribution selection for Fountain coding
    function getIndicesForSeed(seed, numBlocks) {
      if (numBlocks === 1) return [0];
      var rng = PRNG(seed);
      var rand = rng();
      var degree = 1;
      
      // Simple degree distribution: 40% deg 1, 35% deg 2, 25% deg N/2
      if (rand > 0.40 && rand <= 0.75) degree = 2;
      else if (rand > 0.75) degree = Math.max(2, Math.floor(numBlocks / 2));

      var set = [];
      while (set.length < degree) {
        var idx = Math.floor(rng() * numBlocks);
        if (set.indexOf(idx) === -1) set.push(idx);
      }
      return set;
    }

    // --- SENDER ENGINE ---
    function loadFile() {
      var fileInput = document.getElementById('file-input');
      if (!fileInput.files.length) return;
      var file = fileInput.files[0];
      sendFileName = file.name;
      
      var reader = new FileReader();
      reader.onload = function(e) {
        var buffer = new Uint8Array(e.target.result);
        sendBlocks = [];
        totalBlocks = Math.ceil(buffer.length / BLOCK_SIZE);
        
        for (var i = 0; i < totalBlocks; i++) {
          var chunk = new Uint8Array(BLOCK_SIZE);
          var slice = buffer.subarray(i * BLOCK_SIZE, (i + 1) * BLOCK_SIZE);
          chunk.set(slice);
          sendBlocks.push(chunk);
        }
        startStreaming();
      };
      reader.readAsArrayBuffer(file);
    }

    function startStreaming() {
      if (sendTimer) clearInterval(sendTimer);
      sendSeed = 1;

      sendTimer = setInterval(function() {
        if (!sendBlocks.length) return;
        
        var indices = getIndicesForSeed(sendSeed, totalBlocks);
        var payload = new Uint8Array(BLOCK_SIZE);
        
        for (var i = 0; i < indices.length; i++) {
          var block = sendBlocks[indices[i]];
          for (var j = 0; j < BLOCK_SIZE; j++) {
            payload[j] ^= block[j];
          }
        }

        // Convert binary payload to Latin1 string for small QR size
        var binaryStr = "";
        for (var k = 0; k < BLOCK_SIZE; k++) {
          binaryStr += String.fromCharCode(payload[k]);
        }
        
        // Frame format: FTN|FileName|TotalBlocks|Seed|Base64Payload
        var frameData = "FTN|" + sendFileName + "|" + totalBlocks + "|" + sendSeed + "|" + btoa(binaryStr);

        var qr = qrcode(0, 'L');
        qr.addData(frameData);
        qr.make();
        
        document.getElementById('qr-container').innerHTML = qr.createImgTag(5, 0);
        document.getElementById('send-stats').innerText = "Streaming Frame Seed: " + sendSeed + " | Total Blocks: " + totalBlocks;
        
        sendSeed++;
        if (sendSeed > 65535) sendSeed = 1;
      }, 100); // 10 FPS for reliable scanning on older cameras
    }

    // --- RECEIVER ENGINE (iOS 12 COMPATIBLE) ---
    function toggleCamera() {
      var btn = document.getElementById('cam-btn');
      var video = document.getElementById('video');
      
      if (scanning) {
        scanning = false;
        if (videoStream) {
          var tracks = videoStream.getTracks();
          for (var i = 0; i < tracks.length; i++) tracks[i].stop();
        }
        btn.innerText = "Start Camera";
        document.getElementById('recv-stats').innerText = "Stopped";
        return;
      }

      // Simplified constraints specifically for legacy iOS WebKit
      var constraints = { video: true };

      // Helper to support legacy getUserMedia syntax on older WebKit engines
      var getUserMediaFn = function(c) {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          return navigator.mediaDevices.getUserMedia(c);
        }
        var legacyGUM = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
        if (!legacyGUM) {
          return Promise.reject(new Error("Camera API not supported on this browser version."));
        }
        return new Promise(function(resolve, reject) {
          legacyGUM.call(navigator, c, resolve, reject);
        });
      };

      getUserMediaFn(constraints)
        .then(function(stream) {
          videoStream = stream;
          video.srcObject = stream;
          video.setAttribute("playsinline", true);
          video.play();
          scanning = true;
          btn.innerText = "Stop Camera";
          requestAnimationFrame(scanFrame);
        })
        .catch(function(err) {
          alert("Camera Error: " + err.name + " - " + err.message);
        });
    }

    function scanFrame() {
      if (!scanning) return;
      var video = document.getElementById('video');
      var canvas = document.getElementById('canvas');
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

        if (code && code.data && code.data.indexOf("FTN|") === 0) {
          processPacket(code.data);
        }
      }
      requestAnimationFrame(scanFrame);
    }

    function processPacket(raw) {
      var parts = raw.split("|");
      if (parts.length < 5) return;
      
      var fName = parts[1];
      var total = parseInt(parts[2], 10);
      var seed = parseInt(parts[3], 10);
      var b64Data = parts[4];

      if (recvTotal === 0) {
        recvTotal = total;
        recvFileName = fName;
        solvedBlocks = {};
        solvedCount = 0;
        receivedEquations = [];
      }

      var indices = getIndicesForSeed(seed, recvTotal);
      var rawStr = atob(b64Data);
      var data = new Uint8Array(rawStr.length);
      for (var i = 0; i < rawStr.length; i++) data[i] = rawStr.charCodeAt(i);

      // Reduce new packet using already solved blocks
      var activeIndices = [];
      for (var k = 0; k < indices.length; k++) {
        var idx = indices[k];
        if (solvedBlocks[idx]) {
          for (var j = 0; j < data.length; j++) data[j] ^= solvedBlocks[idx][j];
        } else {
          activeIndices.push(idx);
        }
      }

      if (activeIndices.length > 0) {
        receivedEquations.push({ indices: activeIndices, data: data });
        reduceEquations();
      }

      var pct = Math.floor((solvedCount / recvTotal) * 100);
      document.getElementById('progress').style.width = pct + "%";
      document.getElementById('recv-stats').innerText = "Reconstructing: " + solvedCount + " / " + recvTotal + " blocks (" + pct + "%)";

      if (solvedCount === recvTotal && recvTotal > 0) {
        scanning = false;
        document.getElementById('recv-stats').innerText = "Transfer Complete!";
        downloadFile();
      }
    }

    // Belief Propagation Solver for Fountain Codes
    function reduceEquations() {
      var progress = true;
      while (progress) {
        progress = false;
        for (var i = receivedEquations.length - 1; i >= 0; i--) {
          var eq = receivedEquations[i];
          
          // Substitute newly solved blocks
          var nextIndices = [];
          for (var k = 0; k < eq.indices.length; k++) {
            var idx = eq.indices[k];
            if (solvedBlocks[idx]) {
              for (var j = 0; j < eq.data.length; j++) eq.data[j] ^= solvedBlocks[idx][j];
              progress = true;
            } else {
              nextIndices.push(idx);
            }
          }
          eq.indices = nextIndices;

          // If equation reduced to degree 1, we found a block!
          if (eq.indices.length === 1) {
            var solvedIdx = eq.indices[0];
            if (!solvedBlocks[solvedIdx]) {
              solvedBlocks[solvedIdx] = eq.data;
              solvedCount++;
              progress = true;
            }
            receivedEquations.splice(i, 1);
          } else if (eq.indices.length === 0) {
            receivedEquations.splice(i, 1); // Drop redundant packet
          }
        }
      }
    }

    // --- DOWNLOAD / SAVE HANDLER (iOS 12 & ANDROID HYBRID) ---
    function downloadFile() {
      var totalBytes = 0;
      for (var i = 0; i < recvTotal; i++) totalBytes += solvedBlocks[i].length;
      
      var fullBuffer = new Uint8Array(totalBytes);
      var offset = 0;
      for (var j = 0; j < recvTotal; j++) {
        fullBuffer.set(solvedBlocks[j], offset);
        offset += solvedBlocks[j].length;
      }

      // Detect file type (default to PDF mime type if extension is .pdf)
      var isPdf = recvFileName.toLowerCase().endsWith('.pdf');
      var mimeType = isPdf ? 'application/pdf' : 'application/octet-stream';

      var blob = new Blob([fullBuffer], { type: mimeType });
      var url = URL.createObjectURL(blob);

      // Check if device is iOS 12 or below
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      if (isIOS) {
        // iOS 12 Safari fallback: Open in a new tab so iOS renders/previews the file
        var newWindow = window.open(url, '_blank');
        if (!newWindow) {
          window.location.href = url; // Fallback if popup blocker catches it
        }
      } else {
        // Standard download trigger for Android / Desktop
        var a = document.createElement("a");
        a.href = url;
        a.download = recvFileName || "received_file";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    // --- REGISTER SERVICE WORKER FOR OFFLINE CACHING ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        var swCode = "var CACHE='opt-v1'; var ASSETS=['./','https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'];" +
          "self.addEventListener('install', function(e){ e.waitUntil(caches.open(CACHE).then(function(c){ return c.addAll(ASSETS); })); });" +
          "self.addEventListener('fetch', function(e){ e.respondWith(caches.match(e.request).then(function(r){ return r || fetch(e.request); })); });";
        
        var blob = new Blob([swCode], { type: 'text/javascript' });
        var swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).catch(function(err) {
          // Fallback gracefully if blob-based workers are restricted on iOS version
        });
      });
    }
  </script>
</body>
</html>
